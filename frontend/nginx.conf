server {
    listen 80;
    server_name _;
    client_max_body_size 500m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Capability URLs contain bearer material. Keep them out of the edge access
    # log; the backend still validates signature, scope, expiry, and retention.
    location ^~ /api/media/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(api|avatars)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # Never let the SPA fallback turn a legacy raw-media URL into a 200.
    location ~ ^/(uploads|outputs)(/|$) {
        return 404;
    }
}
